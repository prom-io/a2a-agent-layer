name: release

# Cut a release by pushing a semantic version tag from main:
#
#   git tag -a v0.2.0 -m "v0.2.0" && git push origin v0.2.0
#
# The same tag makes the image workflow publish
# ghcr.io/<owner>/a2a-agent-layer:<version> (and :<major>.<minor>), so the
# release notes below can point at an image that is built from this exact tag.
on:
  push:
    tags: ['v*.*.*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: github release
    runs-on: ubuntu-latest
    steps:
      # Full history: the notes are generated from the commits since the
      # previous tag, and the ancestry check below needs main.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The tag filter above is a glob, not a version check: v1.2.x or
      # v01.2.3 would match it. Only strict SemVer 2.0.0 gets released.
      - name: Validate semantic version
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          if ! echo "$tag" | grep -Eq "$semver"; then
            echo "::error::'$tag' is not a semantic version tag (expected vMAJOR.MINOR.PATCH[-prerelease])"
            exit 1
          fi
          version="${tag#v}"
          core="${version%%[-+]*}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "minor=${core%.*}" >> "$GITHUB_OUTPUT"
          case "$version" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      # A release must be something that went through CI on main, not a tag on
      # a feature branch.
      - name: Check the tag is on main
        run: |
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main"
            exit 1
          fi

      - name: Compose release notes header
        run: |
          repo="ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          {
            echo "## Image"
            echo ""
            echo '```'
            echo "docker pull $repo:${{ steps.version.outputs.version }}"
            echo '```'
            echo ""
            echo "Deploy to staging with \`IMAGE_TAG=${{ steps.version.outputs.version }}\` (staging-deploy workflow, manual run)."
            echo "The image is published by the image workflow for this tag and may take a few minutes to appear."
            echo ""
          } > release-header.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body_path: release-header.md
          generate_release_notes: true
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          # Pre-releases must not take over the "latest release" badge.
          make_latest: ${{ steps.version.outputs.prerelease == 'false' }}
