name: image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# Never cancel a publish half-way: a second push to main queues behind the
# first instead of leaving the registry with a partially pushed tag set.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Local-only tag of the image that is scanned before anything is pushed.
  SCAN_TAG: agent-layer:scan

jobs:
  build-and-push:
    name: build, scan and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Lets the scan report be uploaded to the repository's security tab.
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # GITHUB_TOKEN is enough for the repository's own package; no personal
      # access token or extra secret is involved.
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `type=sha` gives every main build an immutable tag. `latest` alone is
      # not enough to roll back to a specific commit.
      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      # Build once into the local daemon and scan that exact image. Scanning
      # after the push would mean a vulnerable image is already pullable by the
      # time anyone finds out.
      - name: Build for scanning
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          push: false
          load: true
          tags: ${{ env.SCAN_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # First pass never fails: it only produces the full HIGH+CRITICAL report.
      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.SCAN_TAG }}
          format: sarif
          output: trivy-results.sarif
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '0'

      # Uploading to the security tab needs code scanning to be available for
      # the repository (public, or GitHub Advanced Security). Where it is not,
      # the upload answers "Resource not accessible by integration"; that must
      # not fail the image build, so this step is best-effort. The gate below
      # does not depend on it.
      - name: Upload scan results
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image

      # Second pass is the gate: a fixable CRITICAL finding fails the job
      # before the push step is reached. Unfixed findings are ignored because
      # no rebuild can clear them.
      - name: Fail on critical findings
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.SCAN_TAG }}
          format: table
          severity: 'CRITICAL'
          ignore-unfixed: true
          exit-code: '1'

      # Rebuilds from the layer cache written above, so this pushes the image
      # that was just scanned.
      - name: Push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          provenance: false

      - name: Summarize
        run: |
          {
            echo "### Published image"
            echo ""
            echo "Digest: \`${{ steps.push.outputs.digest }}\`"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
