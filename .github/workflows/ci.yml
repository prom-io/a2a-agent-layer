name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '20'

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install
        run: npm ci --ignore-scripts

      # --fix is in the package script for local use; CI must not rewrite files
      # and call it green, so run eslint directly.
      - name: Lint
        run: npx eslint "{src,test}/**/*.ts" --max-warnings 0

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install
        run: npm ci --ignore-scripts

      # tsconfig.json covers src, test and scripts; the build config below only
      # compiles src, so this is the step that catches a broken spec or script.
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Build
        run: npm run build

      - name: Check the build produced the entrypoint
        run: test -f dist/main.js

  unit:
    name: unit tests
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install
        run: npm ci --ignore-scripts

      - name: Unit tests
        run: npm test -- --ci --runInBand

  e2e:
    name: e2e tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agent_db
        ports:
          - 5432:5432
        # Without the health check the job races the container and fails on a
        # cold runner.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # test, not development: the schema must come from the migrations, the
      # way it does in production, instead of from TypeORM synchronize.
      NODE_ENV: test
      DATABASE_HOST: localhost
      DATABASE_PORT: '5432'
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: agent_db
      JWT_SECRET: ci-secret-not-used-outside-ci
      CSRF_SECRET: ci-csrf-not-used-outside-ci
      # The well-known first Anvil account, also the default in .env.example.
      # The suite only signs receipts with it; no RPC node is contacted.
      BLOCKCHAIN_PRIVATE_KEY: '0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80'
      BLOCKCHAIN_RPC_URL: http://localhost:8545
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install
        run: npm ci --ignore-scripts

      # The migration runner loads the compiled data source from dist/.
      - name: Build
        run: npm run build

      - name: Run migrations
        run: npm run migration:run

      - name: E2E
        run: npm run test:e2e -- --ci --runInBand

  contracts:
    name: contract tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    env:
      # Fixed seed: a fuzz failure must reproduce on re-run and locally instead
      # of turning into a flaky job.
      FOUNDRY_FUZZ_SEED: '0x70726f6d'
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      # forge-std is listed in .gitmodules but the repository carries no
      # gitlink for it, so a submodule checkout brings nothing. Fetch exactly
      # the revision pinned in foundry.lock instead.
      - name: Install forge-std at the pinned revision
        run: |
          rev="$(jq -r 'to_entries[0].value.tag.rev' foundry.lock)"
          test -n "$rev" && test "$rev" != "null"
          if [ ! -f lib/forge-std/src/Test.sol ]; then
            rm -rf lib/forge-std
            git init -q lib/forge-std
            git -C lib/forge-std remote add origin https://github.com/foundry-rs/forge-std
            git -C lib/forge-std fetch -q --depth 1 origin "$rev"
            git -C lib/forge-std checkout -q FETCH_HEAD
          fi
          echo "forge-std at $(git -C lib/forge-std rev-parse HEAD)"

      - name: Build
        run: forge build --sizes

      - name: Test
        run: forge test -vvv
